<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASE Dashboard</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="bg-cont">
        <div class="bb-c">
            <div class="circle">
                <img src="../assets/about-bg.webp" alt="">
            </div>
        </div>
        <div class="card">
            <div class="card-head">
                <i class="bi bi-stack"></i>
                <h1>Employee Management</h1>
            </div>
            <form id="loginForm" method="post">
                <div class="input-cont">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="input-cont">
                    <label for="password">Password</label>
                    <input type="password" autocomplete="off" name="password" id="password">
                    <i id="passToggle" class="bi bi-eye"></i>
                </div>
                <button type="submit">Login</button>
            </form>
            <p>Don't Have Account <a href="">Send Request.</a></p>
        </div>
    </div>
    <script type="module">

        const passToggle = document.getElementById('passToggle');
        passToggle.addEventListener('click', () => {
            let password = document.getElementById('password');
            if (passToggle.classList.contains('bi-eye')) {
                passToggle.classList.replace('bi-eye', 'bi-eye-slash');
                password.setAttribute('type', 'text');
            } else {
                passToggle.classList.replace('bi-eye-slash', 'bi-eye');
                password.setAttribute('type', 'password');

            }
        });
        
        import data from "../js/context.js";

        const form = document.getElementById("loginForm");

        const submitHandler = (event) => {
            event.preventDefault();
            let email = document.getElementById('email');
            let password = document.getElementById('password');
            let user = data.users.find(user => user.email == email.value && user.password == password.value)
            if (user) {
                localStorage.setItem('loggenInUser', JSON.stringify(user));
                window.location = 'dashboard.html';
            } else {
                Swal.fire({
                    title: 'Wrong Credentials!',
                    icon: 'error',
                    text: 'User not founded with such data.',
                    confirmButtonText: 'Try Again',
                    timer: 3000
                }).then(() => {
                    document.querySelector('.card form').reset();
                })
            }
        };

        form.addEventListener("submit", submitHandler);
    </script>
</body>

</html>
